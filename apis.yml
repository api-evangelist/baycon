name: BAYCON
description: >-
  BAYCON Inc. is a Seoul, South Korea-based mobile connectivity company, founded
  in 2018 and backed by 500 Global and Shorooq Partners (seed round, 2024). BAYCON
  operates a global data eSIM platform and a family of international communication
  apps: eSIM Easy (이심이지), which delivers multi-country data eSIM plans as a QR
  code within minutes of purchase; ModuCall (모두의 국제전화), affordable VoIP
  international calling that lets users place overseas calls using their domestic
  mobile plans; and BayTalk. The company partners with local network operators and
  global carrier infrastructure so international travelers and businesses can access
  local mobile networks without physical SIM cards, cut roaming costs, and stay
  connected across borders, and is expanding into travel content such as attraction
  tickets and transportation passes. BAYCON publishes consumer mobile apps rather
  than a public developer API surface.
